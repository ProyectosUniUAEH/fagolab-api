# ==============================================================================
# GITHUB ACTIONS - fagolab-api
# ==============================================================================
# Generated by Kaanbal Engine
# Environments: prod
# ==============================================================================

name: Deploy fagolab-api

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: "fagolab-api"
  DOCKERHUB_USER: "denissesoftwarefactory"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      deploy_env: ${{ steps.meta.outputs.env }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        run: |
            pip install -r requirements.txt

      - name: Determine environment
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          case "$BRANCH" in
            main)    ENV="prod" ;;
            staging) ENV="staging" ;;
            develop) ENV="dev" ;;
            *)       ENV="dev" ;;
          esac
          TAG="${ENV}-$(echo $GITHUB_SHA | cut -c1-7)"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "env=$ENV" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKERHUB_USER }}/${{ env.APP_NAME }}:${{ steps.meta.outputs.tag }}

  update-infra:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Update infrastructure
        env:
          INFRA_REPO_AUTH: ${{ secrets.INFRA_REPO_AUTH }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
        run: |
          git clone --depth 1 https://${INFRA_REPO_AUTH}@github.com/ProyectosUniUAEH/infra-gitops.git
          cd infra-gitops
          git config user.email "pipeline@softwarefactory.site"
          git config user.name "GitHub Actions"

          cd apps/fagolab-api/overlays/$DEPLOY_ENV
          sed -i "s|newName.*|newName: denissesoftwarefactory/fagolab-api|g" kustomization.yaml
          sed -i "s/newTag.*/newTag: $IMAGE_TAG/g" kustomization.yaml

          git add kustomization.yaml
          git commit -m "deploy($DEPLOY_ENV): fagolab-api to $IMAGE_TAG [skip ci]"
          cd ../../../../

          # Retry push with rebase
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done
