<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .status {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 6px;
            font-weight: 500;
            text-align: center;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #message {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        #message:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: scale(1);
        }

        #log {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            padding: 16px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        #log::-webkit-scrollbar {
            width: 8px;
        }

        #log::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        #log::-webkit-scrollbar-thumb {
            background: #c0c0c0;
            border-radius: 10px;
        }

        #log::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 4px 0;
        }

        .log-sent {
            color: #2196F3;
            font-weight: 600;
        }

        .log-received {
            color: #4CAF50;
        }

        .log-error {
            color: #f44336;
            font-weight: 600;
        }

        .log-info {
            color: #666;
            font-style: italic;
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 WebSocket Test Client</h1>

        <div class="status connecting" id="status">Connecting...</div>

        <div class="input-group">
            <input
                type="text"
                id="message"
                placeholder="Enter a message and press Send or Enter..."
                disabled
            >
            <button id="send" onclick="send()" disabled>Send</button>
        </div>

        <div id="log"></div>

        <div class="info-box">
            💡 Messages sent will be echoed back from the server.
        </div>
    </div>

    <script>
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws';

        let ws = null;
        const statusEl = document.getElementById('status');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('send');
        const logEl = document.getElementById('log');

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;

            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;

            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function connect() {
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = function(event) {
                    statusEl.textContent = '✓ Connected';
                    statusEl.className = 'status connected';
                    messageInput.disabled = false;
                    sendBtn.disabled = false;
                    log('Connected to WebSocket server', 'info');
                };

                ws.onmessage = function(event) {
                    log('← Received: ' + event.data, 'received');
                };

                ws.onerror = function(error) {
                    log('Error: ' + error, 'error');
                    statusEl.textContent = '✗ Error';
                    statusEl.className = 'status disconnected';
                };

                ws.onclose = function(event) {
                    statusEl.textContent = '✗ Disconnected';
                    statusEl.className = 'status disconnected';
                    messageInput.disabled = true;
                    sendBtn.disabled = true;
                    log('Disconnected from server', 'info');

                    // Attempt to reconnect after 3 seconds
                    setTimeout(() => {
                        statusEl.textContent = 'Reconnecting...';
                        statusEl.className = 'status connecting';
                        log('Attempting to reconnect...', 'info');
                        connect();
                    }, 3000);
                };
            } catch (error) {
                log('Connection failed: ' + error, 'error');
                statusEl.textContent = '✗ Connection Failed';
                statusEl.className = 'status disconnected';
            }
        }

        function send() {
            const message = messageInput.value.trim();
            if (!message) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(message);
                log('→ Sent: ' + message, 'sent');
                messageInput.value = '';
                messageInput.focus();
            } else {
                log('WebSocket is not connected', 'error');
            }
        }

        // Allow Enter key to send
        messageInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                send();
            }
        });

        // Initial connection
        connect();
    </script>
</body>
</html>
